# Who may use the Skywalker MCP server (Secret Manager: skywalker-mcp-users).
# The live copy lives outside the repo (default ~/.config/skywalker/mcp-users.yaml);
# deploy.sh uploads it when it changes, and the server re-reads it within 15 s of
# a new secret version reaching the instance.
#
# Roles: read < staff < admin.
#   read   per-project tools (overview, spend, budget, compute, access, exposure ...)
#   staff  read + account- and fleet-wide tools (fleet, spend_all, budgets, trend)
#   admin  same as staff today (no write tools exist)
# Every tool reads Google Cloud as the caller, so a role never grants visibility the
# person's own Google account does not have.
domain: example.edu
# projects: what each person looks at (exact ids, or a prefix ending in "*").
#   read         the ONLY projects they may ask about (no list = no project)
#   staff/admin  any project their Google account can see; the first exact id is
#                their default focus (skywalker_focus changes it, or to "all")
users:
  - {email: alice@example.edu, netid: alice, role: admin, projects: [rc-main-project]}
  - {email: bob@example.edu, netid: bob, role: read, projects: [lab-bob-project, "lab-bob-*"]}

# Programs that sign in once as a person and keep their own token, capped at
# max_role. Redirect URIs: https, or http on loopback (any port).
clients: []
#  - id: skywalker-ultra
#    name: Ultra
#    max_role: staff
#    calls_per_min: 60
#    redirect_uris: ["http://127.0.0.1/callback"]
#  - id: skywalker-gemini-enterprise      # confidential: GE's forms send a secret
#    name: Gemini Enterprise
#    max_role: admin
#    calls_per_min: 120
#    client_secret_sha256: <sha256 hex of the secret>
#    redirect_uris:
#      - https://vertexaisearch.cloud.google.com/oauth-redirect
#      - https://vertexaisearch.cloud.google.com/static/oauth/oauth.html

# Dynamic client ids (mcp_...) to cut off, e.g. a connector on a lost laptop.
disabled_clients: []

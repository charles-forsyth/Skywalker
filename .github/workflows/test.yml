name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python
        run: uv python install 3.12
      - name: Lockfile in sync
        run: uv lock --check
      - name: No private settings or keys in the repo
        run: |
          ! git grep -nIE 'AIza[0-9A-Za-z_-]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY|ghp_[0-9A-Za-z]{30,}|GOCSPX-' -- . ':!uv.lock'
          ! git grep -nIE '01B8C7-D13B5E|gcp_billing_export_v1_01B8C7' -- mcp_server src/skywalker/intel tests/mcp
      - name: Run Ruff
        run: uv run --extra dev ruff check .
      - name: Run Ruff Format
        run: uv run --extra dev ruff format --check .

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python
        run: uv python install 3.12
      - name: Run Mypy
        run: uv run --extra dev mypy src

  test:
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Run tests
        run: uv run --extra test pytest

  mcp:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: MCP server tests (pinned like the image)
        run: bash scripts/test_mcp.sh
      - name: Every security guard is covered by a test
        run: python3 scripts/mcp_mutation_check.py
